services:
  guatapo-os:
    container_name: guatapo-os
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      CASTELNOVA_HUB_URL: ${CASTELNOVA_HUB_URL:-}
      CASTELNOVA_INSTALLATION_ID: ${CASTELNOVA_INSTALLATION_ID:-}
      CASTELNOVA_INSTALLATION_KEY: ${CASTELNOVA_INSTALLATION_KEY:-}
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - caddy

networks:
  caddy:
    external: true
    name: castelnova_proxy

